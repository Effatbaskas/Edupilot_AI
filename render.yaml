services:
  - type: web
    name: edupilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edupilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: AI_MODE
        value: mock
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: edupilot-db
    plan: free
    databaseName: edupilot
    user: edupilot
    postgresMajorVersion: "16"
